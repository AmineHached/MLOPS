name: ML Pipeline

on:
  push:
    branches:
      - main
      - Khaldi  # Adjust branches as needed

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for DVC

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'  # Adjust version if needed

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install dvc

    - name: Configure Git for DVC
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Pull DVC data
      run: |
        dvc pull || echo "No remote configured or data to pull"

    - name: Run DVC pipeline
      run: |
        dvc repro

    - name: Train model
      run: |
        python train_mlflow.py

    - name: Evaluate model
      run: |
        # Add evaluation script if exists, e.g., python evaluate.py
        # For now, assume evaluation is part of training or add a simple check
        echo "Evaluation step: Check MLflow runs for metrics"
        # Example: python -c "import mlflow; runs = mlflow.search_runs(); print(runs.tail())"