name: ML Pipeline

on:
  push:
    branches:
      - main
      - Khaldi

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install dvc

    - name: Run DVC pipeline
      run: dvc repro

    - name: Train and evaluate model
      run: |
        python train_mlflow.py
        python -c "import mlflow; runs = mlflow.search_runs(); print('Latest run metrics:', runs.iloc[-1]['metrics'] if not runs.empty else 'No runs')"